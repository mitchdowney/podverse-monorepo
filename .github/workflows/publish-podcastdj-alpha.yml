name: "Publish PodcastDJ Alpha"

on:
  push:
    branches:
      - podcastdj-alpha
  workflow_dispatch:
    inputs:
      version_override:
        description: "Optional version override (default: auto-increment from GHCR)"
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v6

      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: "Install dependencies"
        run: npm ci

      - name: "Security audit"
        run: npm audit

      - name: "Build all packages"
        run: npm run build:packages

      - name: "Lint"
        run: npm run lint

      - name: "Type check"
        run: npm run type-check

      - name: "Setup env files for web apps"
        run: |
          cp apps/web/env/alpha.env apps/web/.env
          cp apps/management-web/env/alpha.env apps/management-web/.env

      - name: "Build all apps"
        run: npm run build:apps

      - name: "Calculate unified version"
        id: version
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_MITCH_TOKEN }}
        run: |
          # If version override is provided, use it
          if [ -n "${{ inputs.version_override }}" ]; then
            echo "Using version override: ${{ inputs.version_override }}"
            echo "VERSION=${{ inputs.version_override }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Get base version from package.json (strip any existing suffix)
          BASE_VERSION=$(node -p "require('./package.json').version" | sed 's/-.*//')
          # Use web-deploy-podcastdj-alpha as reference image for version calculation
          IMAGE_PATH="mitchdowney/podverse-monorepo/web-deploy-podcastdj-alpha"

          echo "Base version: $BASE_VERSION"
          echo "Reference image path: $IMAGE_PATH"

          # Query GHCR for existing tags
          TAGS_JSON=$(curl -s -H "Authorization: Bearer $GHCR_TOKEN" \
            "https://ghcr.io/v2/${IMAGE_PATH}/tags/list" || echo '{"tags":[]}')

          echo "Raw tags JSON: $TAGS_JSON"

          # Extract alpha tags for this base version
          TAGS=$(echo "$TAGS_JSON" | jq -r '.tags[]?' 2>/dev/null | grep "^${BASE_VERSION}-alpha\." || true)
          echo "Filtered alpha tags for ${BASE_VERSION}: $TAGS"

          # Find the latest alpha version number
          if [ -z "$TAGS" ]; then
            echo "No existing alpha tags found for ${BASE_VERSION}. Starting at alpha.0"
            NEXT_VERSION="${BASE_VERSION}-alpha.0"
          else
            # Get the highest alpha number
            LATEST=$(echo "$TAGS" | sort -t. -k4 -n | tail -n1)
            CURRENT_NUM=$(echo "$LATEST" | sed -En 's/.*alpha\.([0-9]+)$/\1/p')

            if [ -z "$CURRENT_NUM" ]; then
              NEXT_VERSION="${BASE_VERSION}-alpha.0"
            else
              NEXT_NUM=$((CURRENT_NUM + 1))
              NEXT_VERSION="${BASE_VERSION}-alpha.${NEXT_NUM}"
            fi
            echo "Latest existing: $LATEST, incrementing to: $NEXT_VERSION"
          fi

          echo "Unified version for all images: $NEXT_VERSION"
          echo "VERSION=$NEXT_VERSION" >> $GITHUB_OUTPUT

  publish-docker:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: "Get unified version"
        id: version
        run: |
          echo "VERSION=${{ needs.validate.outputs.version }}" >> $GITHUB_OUTPUT
          echo "Using unified version: ${{ needs.validate.outputs.version }}"

      - name: "Set up Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Login to GHCR"
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_MITCH_TOKEN }}

      - name: "Build and push Docker image"
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile.build.alpha-podverse.k.podcastdj.com
          push: true
          build-args: ENV_FILE=apps/web/env/alpha-podverse.k.podcastdj.com.env
          tags: |
            ghcr.io/mitchdowney/podverse-monorepo/web-deploy-podcastdj-alpha:${{ steps.version.outputs.VERSION }}
            ghcr.io/mitchdowney/podverse-monorepo/web-deploy-podcastdj-alpha:alpha
          cache-from: type=gha
          cache-to: type=gha,mode=max
